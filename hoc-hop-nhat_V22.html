<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học hợp nhất BCTC</title>
<style>
  :root {
    --paper: #EEF1F5; --card: #FFFFFF; --ink: #1C2B39; --ink-soft: #5B6B78; --ink-faint: #8A97A3;
    --emerald: #1F7A5C; --emerald-bg: #E6F2ED; --rust: #B84A39; --rust-bg: #F7EAE7;
    --gold: #B9852E; --gold-bg: #F6EEDD; --line: #DBE1E7; --line-soft: #E9EDF1; --radius: 10px;
    --serif: 'Segoe UI', -apple-system, Arial, sans-serif; --sans: 'Segoe UI', -apple-system, Arial, sans-serif; --mono: Consolas, 'SF Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.55; }
  #app { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
  .masthead { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px;
    border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 8px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; margin: 0; }
  .years button { font: inherit; font-size: .82rem; padding: 6px 12px; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer; margin-left: 4px; }
  .years button[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .notice { font-size: .78rem; color: var(--rust); margin: 0 0 16px; }
  .layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
  nav { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 8px; position: sticky; top: 12px; }
  nav button { display: block; width: 100%; text-align: left; font: inherit; font-size: .86rem; padding: 8px 10px; border: 0;
    background: transparent; color: var(--ink-soft); border-radius: 7px; cursor: pointer; }
  nav .group { font-size: .72rem; font-weight: 600; color: var(--ink-faint); padding: 10px 10px 4px; white-space: nowrap; }
  nav button:hover { background: var(--emerald-bg); color: var(--ink); }
  nav button[aria-current=true] { background: var(--gold-bg); color: var(--ink); font-weight: 600; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--emerald); outline-offset: 2px; }
  .card { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  h2 { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; margin: 0 0 8px; scroll-margin-top: 12px; }
  h3 { font-family: var(--serif); font-weight: 600; font-size: 1rem; margin: 0 0 8px; }
  p { margin: 0 0 10px; } ul { margin: 0 0 10px; padding-left: 20px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  th { text-align: right; font-weight: 500; color: var(--ink-soft); font-size: .75rem; padding: 6px 8px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
  td { text-align: right; font-family: var(--mono); padding: 5px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th.l, td.l { text-align: left; font-family: var(--sans); white-space: normal; min-width: 130px; }
  tr.total td { font-weight: 700; border-top: 1.5px solid var(--ink); }
  tr.changed td { background: var(--gold-bg); }
  .entry { border-left: 3px solid var(--gold); padding: 2px 0 2px 12px; margin-bottom: 16px; }
  .entry .why { font-size: .84rem; color: var(--ink-soft); }
  .entry table { max-width: 520px; }
  .quiz { background: var(--emerald-bg); border-radius: 8px; padding: 12px 14px; }
  .quiz label { display: block; margin-bottom: 8px; }
  .quiz input { font: inherit; width: 130px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .btn { font: inherit; font-size: .84rem; padding: 7px 13px; border-radius: 7px; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; margin: 0 4px 4px 0; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .fb { display: block; margin-top: 8px; font-size: .86rem; }
  .fb.ok { color: var(--emerald); } .fb.no { color: var(--rust); }
  .toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 4px 12px; font-size: .82rem; margin-bottom: 10px; }
  .toggles label { display: flex; gap: 6px; align-items: flex-start; cursor: pointer; }
  .status { padding: 8px 12px; border-radius: 7px; font-size: .86rem; margin-bottom: 10px; }
  .status.ok { background: var(--emerald-bg); color: var(--emerald); } .status.warn { background: var(--gold-bg); color: #7A5716; }
  .tree { display: grid; gap: 8px; font-size: .9rem; }
  .node { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--card); }
  .node small { color: var(--ink-soft); display: block; }
  .node.l1 { margin-left: 24px; } .node.l2 { margin-left: 48px; } .node.assoc { border-style: dashed; }
  .matrix td, .matrix th { text-align: center; }
  .matrix td button { font: inherit; width: 100%; min-height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); cursor: pointer; }
  .matrix td button.diff { background: var(--rust-bg); border-color: var(--rust); }
  .matrix td button.same { background: var(--emerald-bg); }
  .matrix td button[aria-pressed=true] { outline: 2px solid var(--ink); }
  .classify select { font: inherit; font-size: .82rem; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
  table td.t { white-space: normal; font-family: var(--sans); text-align: left; min-width: 110px; }
  .pager { display: flex; justify-content: space-between; gap: 8px; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    nav { position: static; display: flex; overflow-x: auto; gap: 2px; }
    nav button { width: auto; white-space: nowrap; }
  }
</style>
</head>

      <p>Trước khi loại trừ, tách giá trị đầu tư thành từng phần để biết mỗi đồng đi đâu. Phần còn lại phải giải thích được.</p>
      ${table(['Alpha đầu tư vào Kilo (70%)', 'Số tiền'], [['Giá trị đầu tư', 3600], ['Phần vốn góp: 70% × 4.000', -2800], ['Thặng dư: 70% × 500', -350], ['Lợi thế thương mại', -400], ['Chênh lệch khác', 50]], true)}
      <p style="margin-top:10px">Chênh lệch khác ở đây là mua thêm không đổi kiểm soát, xem bài Đổi trạng thái. Nếu vốn và số đầu tư lệch vì cổ tức bằng cổ phiếu thì bảng có thêm cột điều chỉnh chênh lệch đối chiếu vốn, xem phần dưới. Mỗi năm phải so chênh lệch khác với năm trước, phần thay đổi phải giải thích được.</p></div>
      ${box('Cổ tức bằng cổ phiếu', '<p>Kilo chia cổ tức bằng cổ phiếu 1.000: vốn góp tăng từ 4.000 lên 5.000, lợi nhuận giảm 1.000. Alpha chỉ tăng số cổ phiếu, không tăng giá trị đầu tư, nên phần vốn tăng của Alpha không có gì để loại trừ.</p>' + bt('Chuyển phần vốn tăng của Alpha sang vốn khác', '70% × 1.000. NCI vẫn tính 30% trên từng thành phần vốn mới, nên không có bút toán riêng cho phần này.', [['Nợ 4111 – Vốn góp', 700, 0], ['Có 4118 – Vốn khác', 0, 700]]) + table(['Kiểm tra 4111 của Kilo', 'Số tiền'], [['Vốn góp sau chia cổ tức', 5000], ['Loại trừ với đầu tư: 70% × 4.000', -2800], ['Chuyển sang 4118', -700], ['NCI: 30% × 5.000', -1500], ['Còn lại', 0]], true))}
      ${quiz('a-tach', 'Giá trị đầu tư 5.000, sở hữu 80%, vốn góp 5.000, thặng dư 500, LTTM 500. Chênh lệch khác là bao nhiêu?', 100, '5.000 − 4.000 − 400 − 500 = 100.')}` },
  { t: 'Make up và Revert', r: () => `<div class="card"><h2>Make up và Revert</h2>${CASE}
      <p>Mỗi đơn vị chỉ biết phần mình đầu tư, nên phân loại ở đơn vị có thể khác phân loại trên tập đoàn. So từng khoản để biết phải làm gì.</p>
      ${table(['Tại đơn vị', 'Trên tập đoàn', 'Việc phải làm'], [['Đầu tư khác', 'Liên doanh, liên kết', 'Make up: tính thêm theo vốn chủ'], ['Liên doanh, liên kết', 'Công ty con', 'Revert: đảo vốn chủ của đơn vị'], ['Liên doanh, liên kết', 'Đầu tư khác', 'Revert: đảo vốn chủ, chuyển 228'], ['Giống nhau', 'Giống nhau', 'Không làm gì']])}</div>
      ${box('Make up', '<p>Alpha giữ 25% Mike, Charlie giữ 5% ghi 228 số 100. Cộng lại đủ ảnh hưởng đáng kể nên phần của Charlie cũng thành liên kết. Lãi sau ngày đầu tư thuộc phần 5% là 60, trong đó năm nay 20.</p>' +
        bt('Phân loại lại', 'Đưa khoản đầu tư sang liên kết.', [['Nợ 222 – Đầu tư liên kết', 100, 0], ['Có 228 – Đầu tư khác', 0, 100]]) +
        bt('Tính theo vốn chủ', 'Khoản này do Charlie nắm nên 30% thuộc NCI. Lãi năm trước 40 chia 28 vào 421 và 12 vào NCI. Lãi năm nay 20 vào KQKD, trong đó NCI được phân bổ 6 ở dòng lợi nhuận của NCI.', [['Nợ 222 – Đầu tư liên kết', 60, 0], ['Có 421 – LNCPP', 0, 28], ['Có 429 – NCI', 0, 12], ['Có LK – Phần lãi liên kết', 0, 20]]) + '<p>Nếu ảnh hưởng dưới ngưỡng, có thể chưa ghi nhưng phải có phép tính. Khi thiếu báo cáo của công ty nhận đầu tư thì phải ghi rõ giới hạn này.</p>')}
      ${box('Revert', '<p>Bravo đang ghi Oscar theo vốn chủ, cộng thêm 50 vào giá trị đầu tư. Oscar là con của Charlie nên đã hợp nhất toàn bộ. Giữ lại sẽ tính trùng.</p>' +
        bt('Đảo vốn chủ của đơn vị', 'Trong 50 có 30 của các năm trước và 20 năm nay.', [['Nợ 421 – LNCPP', 30, 0], ['Nợ LK – Phần lãi liên kết', 20, 0], ['Có 222 – Đầu tư liên kết', 0, 50]]) + '<p>Bravo sở hữu 100% nên bài này không có NCI. Nếu đơn vị nắm khoản đầu tư có NCI, hoặc đã ghi LTTM và cổ tức theo vốn chủ, thì bút toán Revert phải đảo cả các phần đó. Khoản lãi chia cho NCI ở cấp dưới cũng phải được loại để không trùng.</p>')}
      ${box('Khi công ty liên kết âm vốn', '<p>Phần lỗ chỉ ghi giảm giá trị đầu tư đến 0. Nếu có nghĩa vụ thanh toán thay, phần lỗ vượt ghi vào chi phí phải trả. Khi liên kết có lãi trở lại, chỉ ghi lãi sau khi đã bù hết phần lỗ chưa ghi, nên phải theo dõi riêng phần lỗ này.</p>')}
      ${labHtml('mk')}
      ${quiz('a-mk', 'Phần lãi Make up trong tình huống trên làm giá trị đầu tư tăng bao nhiêu (chưa tính phân loại lại)?', 60, 'Lãi lũy kế 40 cộng lãi năm nay 20.')}` },
  { t: 'Mua rẻ và mua nhiều lần', r: () => `<div class="card"><h2>Mua rẻ và mua qua nhiều giai đoạn</h2>${CASE}
      <p>Giá phí nhỏ hơn phần sở hữu trong giá trị hợp lý tài sản thuần thì không có LTTM mà có lãi mua rẻ. Khi đạt kiểm soát sau nhiều lần mua, phần đã giữ phải đánh giá lại theo giá trị hợp lý rồi mới tính LTTM (TT202 Điều 10, 15, 16).</p></div>
      ${box('Lãi mua rẻ', '<p>Alpha mua 100% Romeo giá 800. Vốn Romeo 1.000, giá trị hợp lý bằng giá trị ghi sổ. VAS 11 đoạn 55: trước khi ghi lãi phải xem lại việc xác định giá trị hợp lý và giá phí; chênh lệch còn lại mới ghi ngay vào KQKD.</p>' + bt('Loại trừ đầu tư, ghi lãi mua rẻ', 'Lãi ghi vào thu nhập khác trong kỳ mua, các kỳ sau đi qua 421.', [['Nợ 4111 – Vốn góp', 1000, 0], ['Có 221 – Đầu tư vào công ty con', 0, 800], ['Có 711 – Thu nhập khác', 0, 200]]))}
      ${box('Mua nhiều lần, trước đó là liên kết', '<p>Alpha giữ 30% Sierra, giá gốc 300, giá trị theo vốn chủ 380. Nay mua thêm 40% giá 600 và đạt kiểm soát. Giá trị hợp lý của 30% cũ là 420. Giá trị hợp lý tài sản thuần Sierra là 1.300.</p>' + table(['Tính LTTM', 'Số tiền'], [['Phần cũ theo giá trị hợp lý', 420], ['Giá phí lần mua mới', 600], ['Giá phí trên hợp nhất', 1020], ['70% × 1.300', -910], ['LTTM', 110]], true) + bt('Chênh lệch từ giá gốc lên vốn chủ', '380 − 300 ghi vào vốn chủ, không qua KQKD.', [['Nợ 221 – Đầu tư vào công ty con', 80, 0], ['Có 421 – LNCPP', 0, 80]]) + bt('Chênh lệch từ vốn chủ lên giá trị hợp lý', '420 − 380 ghi vào KQKD kỳ đạt kiểm soát, các kỳ sau đi qua 421.', [['Nợ 221 – Đầu tư vào công ty con', 40, 0], ['Có 515 – Doanh thu tài chính', 0, 40]]) + '<p>Nếu trước đó chỉ là đầu tư theo giá gốc, không có ảnh hưởng đáng kể, thì toàn bộ chênh lệch giá trị hợp lý so với giá gốc vào KQKD.</p><p>VAS 11 đoạn 25 tính giá phí là tổng chi phí các giao dịch đơn lẻ; TT202 Điều 10 và 15 đánh giá lại phần cũ theo giá trị hợp lý. Ví dụ trên theo TT202.</p>')}
      ${quiz('a-bp', 'Mua 80% giá 700. Giá trị hợp lý tài sản thuần 1.000. Lãi mua rẻ là bao nhiêu?', 100, '80% × 1.000 − 700 = 100.')}
      ${quiz('a-step', 'Phần cũ 20% theo giá trị hợp lý 300, mua thêm 40% giá 700. Giá trị hợp lý tài sản thuần 1.500. LTTM là bao nhiêu?', 100, '300 + 700 − 60% × 1.500 = 100.')}` },
  { t: 'Vốn công ty con biến động', r: () => `<div class="card"><h2>Vốn công ty con biến động</h2>${CASE}
      <p>Các giao dịch này làm phần sở hữu của mẹ và NCI đổi mà không mất kiểm soát. Cách chung: tính phần của mẹ trong tài sản thuần trước và sau, chênh lệch ghi thẳng vào 421 đối ứng 429.</p></div>
      ${box('Công ty con huy động thêm vốn', '<p>Tango có tài sản thuần 1.000, Alpha giữ 60%. Tango huy động 500, Alpha góp 400 và NCI góp 100, tỷ lệ Alpha thành 70% (TT202 Điều 54).</p>' + table(['Phần của Alpha', 'Số tiền'], [['Sau: 70% × 1.500', 1050], ['Trước: 60% × 1.000', -600], ['Tăng thêm', 450], ['Vốn góp thêm', -400], ['Chênh lệch', 50]], true) + bt('Phần tăng lớn hơn vốn góp', 'Kiểm tra NCI: từ 400 lên 450, tăng 50 trong khi góp 100, thiếu đúng 50.', [['Nợ 429 – NCI', 50, 0], ['Có 421 – LNCPP', 0, 50]]))}
      ${box('Công ty con mua cổ phiếu quỹ', '<p>Uniform có tài sản thuần 1.000, Alpha giữ 60%. Uniform mua từ NCI 20% số cổ phiếu giá 300. Tài sản thuần còn 700, tỷ lệ Alpha 60 / 80 = 75% (TT202 Điều 17).</p>' + table(['Phần của Alpha', 'Số tiền'], [['Sau: 75% × 700', 525], ['Trước: 60% × 1.000', -600], ['Giảm', -75]], true) + bt('Phần của mẹ giảm', 'Các kỳ sau đi qua 421 lũy kế.', [['Nợ 421 – LNCPP', 75, 0], ['Có 429 – NCI', 0, 75]]))}
      ${box('Công ty con đầu tư ngược công ty mẹ', bt('Trình bày là cổ phiếu quỹ', 'Bravo giữ cổ phiếu Alpha 100, đang ghi là đầu tư góp vốn. Nếu công ty mẹ không phải công ty cổ phần thì thuyết minh rõ chỉ tiêu này là vốn góp của công ty con.', [['Nợ 419 – Cổ phiếu mua lại của chính mình', 100, 0], ['Có 228 – Đầu tư khác', 0, 100]]))}
      ${box('Cổ tức ưu đãi của NCI', '<p>Cổ phiếu ưu đãi phân loại là nợ thì cổ tức là chi phí tài chính, không điều chỉnh. Phân loại là vốn chủ thì tách cổ tức ưu đãi trước khi chia phần phổ thông, và trước khi trích quỹ (Điều 23, 24).</p>' + table(['Victor, NCI giữ 30% phổ thông và toàn bộ ưu đãi', 'Số tiền'], [['Lợi nhuận sau thuế', 500], ['Cổ tức ưu đãi', -50], ['Phần còn lại', 450], ['NCI: 50 + 30% × 450', 185]]) + bt('Tách cổ tức ưu đãi lũy kế chưa trả', 'Số chưa trả các kỳ trước 40, tách trước khi tính phần phổ thông.', [['Nợ 421 – LNCPP', 40, 0], ['Có 429 – NCI', 0, 40]]))}
      ${box('Quỹ khen thưởng, phúc lợi', '<p>Whiskey chưa trích quỹ, ước phải trích 100, Alpha giữ 70% (Điều 25).</p>' + bt('Ước trích trên hợp nhất', 'Chia theo tỷ lệ sở hữu trước khi xác định phần lợi nhuận.', [['Nợ 421 – LNCPP', 70, 0], ['Nợ 429 – NCI', 30, 0], ['Có 353 – Quỹ khen thưởng, phúc lợi', 0, 100]]) + '<p>Nếu Whiskey đã trích rồi thì chỉ cần điều chỉnh phần NCI: Nợ 429, Có 353 số 30.</p>')}
      ${quiz('a-rs', 'Con có tài sản thuần 2.000, mẹ 50%. Huy động 1.000, mẹ góp 700, tỷ lệ mẹ thành 60%. Phần tăng của mẹ cao hơn vốn góp bao nhiêu?', 100, '60% × 3.000 − 50% × 2.000 = 800; 800 − 700 = 100.')}
      ${quiz('a-pref', 'Lợi nhuận sau thuế 1.000, cổ tức ưu đãi của NCI 100, NCI giữ 20% phổ thông. Lợi ích NCI trong kỳ là bao nhiêu?', 280, '100 + 20% × 900 = 280.')}` },
  { t: 'Đổi trạng thái', r: () => `<div class="card"><h2>Mất kiểm soát và đổi tỷ lệ</h2>${CASE}
      <p>Juliet là con 60%, giá gốc 600, tài sản thuần ngày mua 1.000, không có LTTM. Đến ngày bán tài sản thuần là 1.500. Alpha bán 20% giá 400 và còn 40% là liên kết.</p>
      ${table(['Lãi bán', 'Số tiền'], [['BCTC riêng: 400 − 200 giá gốc', 200], ['Hợp nhất: 400 − 20% × 1.500', 100], ['Phải giảm lãi khi hợp nhất', 100]])}</div>
      ${box('Bút toán từ ngày mất kiểm soát', bt('Dừng hợp nhất, phần còn lại theo vốn chủ', 'Lãi sau ngày mua của phần 60% là 300 đã vào hợp nhất các năm trước. Phần 40% còn lại có giá trị 600 trên hợp nhất so với 400 giá gốc.', [['Nợ 222 – Đầu tư liên kết', 200, 0], ['Nợ 515 – Lãi bán', 100, 0], ['Có 421 – LNCPP', 0, 300]]) + '<p>Kết quả kinh doanh của Juliet chỉ hợp nhất đến ngày mất kiểm soát. Giả định không có LTTM và cổ tức. Nếu còn LTTM chưa phân bổ thì phải xóa cùng lúc và trừ vào lãi: lãi hợp nhất = số thu − tài sản thuần chuyển giao − LTTM chưa phân bổ (TT202 Điều 49).</p>')}
      ${box('Mua thêm khi vẫn kiểm soát', '<p>Alpha mua thêm 10% giá 180 khi tài sản thuần là 1.500. Vì không đổi kiểm soát nên không tạo LTTM mới; chênh lệch vào vốn chủ.</p>' + bt('Giảm NCI, chênh lệch vào 421', 'TT202 coi đây là giao dịch vốn chủ sở hữu: chênh lệch ghi trực tiếp vào lợi nhuận sau thuế chưa phân phối, không qua KQKD.', [['Nợ 429 – NCI', 150, 0], ['Nợ 421 – LNCPP', 30, 0], ['Có 221 – Đầu tư công ty con', 0, 180]]))}
      ${box('NCI khi tỷ lệ đổi giữa năm', '<p>Lima có NCI 40% đến 30/6 và 30% từ 1/7. Chia năm thành hai giai đoạn, dùng báo cáo gần ngày đổi tỷ lệ nếu biến động trong khoảng chênh không trọng yếu. Cổ tức xét theo ngày chốt quyền. Cổ phiếu phát hành cho người ngoài thì phần vốn tăng đó thuộc NCI.</p>' + table(['Khoản', 'Lima', 'Tỷ lệ NCI', 'Phần NCI'], [['Lãi 6 tháng đầu', 100, '40%', 40], ['Lãi 6 tháng cuối', 200, '30%', 60], ['Cổ tức chốt quyền tháng 9', -50, '30%', -15], ['Ảnh hưởng tới NCI', 250, '', 85]], true) + '<p style="margin-top:10px">Việc chia giai đoạn phải cuốn tiếp sang các năm sau, nên cần giữ bảng theo từng thành phần vốn.</p>')}
      ${calcHtml('nci')}
      ${quiz('a-nci2', 'Lãi 300 trước ngày đổi tỷ lệ với NCI 20%, lãi 100 sau đó với NCI 50%. Phần lãi của NCI là bao nhiêu?', 110, '300 × 20% + 100 × 50% = 110.')}
      ${box('Bán bớt rồi mới mất kiểm soát', '<p>Bán bớt mà vẫn kiểm soát thì kết quả ghi vào 421. Nếu sau đó mất kiểm soát, phần đã ghi ở 421 được kết chuyển sang KQKD hợp nhất cùng kết quả thoái vốn.</p>')}
      ${box('Hợp nhất nhiều cấp', '<p>Khi công ty con có báo cáo hợp nhất riêng, xác định rõ tập đoàn nhặt số nào. Công ty con cấp 2 phải có cùng bộ khoản loại trừ, nếu không sẽ thiếu hoặc trùng.</p>')}
      ${quiz('a-loss', 'Bán 30% giá 700 khi tài sản thuần 2.000, không có LTTM. Lãi trên hợp nhất là bao nhiêu?', 100, '700 − 30% × 2.000 = 100.')}` },
  { t: 'Chuyển giao trong tập đoàn', r: () => `<div class="card"><h2>Chuyển giao công ty con trong tập đoàn</h2>${CASE}
      <p>Đây là hợp nhất dưới sự kiểm soát chung, không phải thoái đầu tư. Số hợp nhất về bản chất không đổi, LTTM ban đầu giữ nguyên. Chỉ có hai việc: loại lãi, lỗ của bên bán và ghi lại phần chia giữa mẹ và NCI (TT202 Điều 48, 55, 56).</p>
      <p>Charlie, con 70% của Alpha, giữ 100% Xray giá gốc 500, tài sản thuần 600. Charlie bán Xray cho Alpha giá 650 bằng tiền.</p></div>
      ${box('Con cấp 2 thành con cấp 1', bt('Loại lãi của Charlie', '650 − 500. Các kỳ sau ghi Nợ 421 thay cho Nợ 515.', [['Nợ 515 – Doanh thu tài chính', 150, 0], ['Có 221 – Đầu tư vào công ty con', 0, 150]]) + table(['Phần của NCI', 'Số tiền'], [['Trước: 30% × 600 tài sản thuần Xray', 180], ['Sau: 30% × 650 tiền Charlie nhận', 195], ['NCI tăng', 15]], true) + bt('Ghi lại phần sở hữu', 'NCI tăng thì phần của mẹ giảm tương ứng.', [['Nợ 421 – LNCPP', 15, 0], ['Có 429 – NCI', 0, 15]]))}
      ${box('Con cấp 1 thành con cấp 2', '<p>Ngược lại, Alpha bán công ty con cho một công ty con khác. Nếu hợp nhất trực tiếp với cấp 2 thì lãi, lỗ được loại ngay trong bút toán loại trừ đầu tư. Nếu dùng báo cáo hợp nhất của cấp 1 thì loại riêng: lãi ghi Nợ 515, Có 421; lỗ ghi Nợ 421, Có 635. LTTM phát sinh thêm trên báo cáo của cấp 1 phải đưa về mức ban đầu. Phần NCI so sánh phần của NCI trong giá phí bên mua với phần của NCI trong tài sản thuần được bán.</p>')}
      ${quiz('a-reorg', 'Con 80% bán con cấp 2 (tài sản thuần 1.000) cho mẹ giá 1.200. NCI tăng bao nhiêu?', 40, '20% × 1.200 − 20% × 1.000 = 40.')}` },
  { t: 'Sáp nhập công ty con', r: () => `<div class="card"><h2>Sáp nhập công ty con vào công ty mẹ</h2>${CASE}

      ${table(['Trường hợp', 'Ghi tài sản, nợ nhận về', 'Chênh lệch với giá phí'], [['Hoạt động kinh doanh, dưới kiểm soát chung', 'Giá trị ghi sổ trên BCTC riêng của bên bị sáp nhập', 'Vào 4118, định kỳ kết chuyển sang 421 không quá 10 năm'], ['Hoạt động kinh doanh, không dưới kiểm soát chung', 'Phương pháp mua theo VAS 11', 'LTTM hoặc bất lợi thương mại'], ['Không phải hoạt động kinh doanh', 'Như mua một nhóm tài sản hoặc tài sản thuần', 'Không áp dụng hai dòng trên']])}</div>
      ${box('Dưới kiểm soát chung', bt('Alpha nhận tài sản thuần của Quebec', 'Dừng ghi nhận khoản đầu tư theo giá trị ghi sổ. Tài sản thuần 1.300 lớn hơn giá phí 1.000 nên chênh lệch 300 ghi Có 4118.', [['Nợ Các tài sản nhận về', 1800, 0], ['Có Các khoản nợ nhận về', 0, 500], ['Có 221 – Đầu tư vào công ty con', 0, 1000], ['Có 4118 – Vốn khác', 0, 300]]) + bt('Kết chuyển hằng năm', 'Chọn đường thẳng 10 năm: 300 / 10. Nếu giá phí lớn hơn tài sản thuần thì 4118 dư Nợ và bút toán này đảo chiều.', [['Nợ 4118 – Vốn khác', 30, 0], ['Có 421 – LNST chưa phân phối', 0, 30]]))}
      ${box('Không dưới kiểm soát chung', table(['Giả sử mua từ bên ngoài', 'Số tiền'], [['Giá phí', 1500], ['Giá trị hợp lý tài sản thuần', -1400], ['LTTM', 100]], true) + '<p style="margin-top:10px">Trên sổ riêng, LTTM do mua tài sản thuần không hình thành quan hệ mẹ con ghi vào 242 (Phụ lục II, trừ trường hợp dưới kiểm soát chung). Nếu giá phí nhỏ hơn giá trị hợp lý tài sản thuần thì là bất lợi thương mại, kế toán theo VAS 11.</p>')}
      ${box('Giao dịch nội bộ và thuế', '<p>Sau khi nhận bàn giao, công ty mẹ phải loại trừ giao dịch nội bộ trước khi lập BCTC riêng của kỳ sáp nhập. Thuế hoãn lại phát sinh do lãi, lỗ chưa thực hiện thì theo VAS 17. TT99 không nêu bút toán mẫu cho phần lãi trong tồn kho.</p>' + bt('Loại công nợ giữa hai bên', 'Quebec còn nợ Alpha 200; sau sáp nhập hai số này nằm trên cùng một sổ. Bút toán này minh họa thêm, không nằm trong số tài sản 1.800 ở trên.', [['Nợ 331 – Phải trả', 200, 0], ['Có 131 – Phải thu', 0, 200]]))}
      ${box('Trình bày trên BCTC của bên nhận sáp nhập', table(['Báo cáo', 'Năm nay hoặc số cuối năm', 'Năm trước hoặc số đầu năm'], [['Báo cáo tình hình tài chính', 'Tổng hợp phần nhận về', 'Không đổi'], ['KQKD và lưu chuyển tiền tệ', 'Chỉ số của bên bị sáp nhập từ thời điểm sáp nhập', 'Không đổi']]))}
      ${box('Trên BCTC hợp nhất: phần suy luận', '<p>Điều 23 TT99 chỉ nói về sổ và BCTC riêng; TT202 cũng không có mục riêng cho sáp nhập, và VAS 11 đoạn 03 không áp dụng cho hợp nhất dưới kiểm soát chung. Các ý sau là suy luận, cần người có chuyên môn xác nhận. Đến ngày sáp nhập Quebec vẫn được hợp nhất như công ty con, sau đó không còn bút toán loại trừ vốn. Phần 4118 có thể chứa lãi sau ngày mua đã nằm trong 421 hợp nhất, nên cần xem lại để không tính trùng. Xử lý LTTM hợp nhất còn lại cũng cần xem riêng.</p>')}

      ${quiz('a-mg2', 'Sáp nhập không dưới kiểm soát chung: giá phí 2.000, giá trị hợp lý tài sản thuần 1.750. LTTM là bao nhiêu?', 250, '2.000 − 1.750 = 250.')}` },
  { g: 'Nâng cao: giao dịch nội bộ', t: 'Thu chi khác chỉ tiêu', r: () => `<div class="card"><h2>Thu chi nội bộ khác chỉ tiêu</h2>${CASE}

        bt('Phí chỉ ghi ở một phía', 'Delta ghi chi phí 15, Alpha chưa ghi doanh thu. Ghi thêm phía thiếu rồi mới loại trừ cả cặp.', [['Nợ 131NB – Phải thu nội bộ', 15, 0], ['Có 511 – Doanh thu', 0, 15]]))}
      ${box('Khi đối ứng nằm trên tài sản', '<p>Nếu bên trả đã đưa khoản này vào 241 hoặc 352, đối ứng đúng là tài khoản đó chứ không phải chi phí. Nếu số nhỏ và tạm để ở chi phí thì phải ghi nhận lý do bỏ qua.</p>')}

  { t: 'Dự phòng nội bộ', r: () => `<div class="card"><h2>Dự phòng nội bộ và thuế hoãn lại</h2>${CASE}

      ${box('Năm phát sinh', bt('Hoàn dự phòng phải thu nội bộ', 'Alpha trích 100 cho khoản phải thu Charlie.', [['Nợ 2293 – Dự phòng phải thu', 100, 0], ['Có 642 – Chi phí quản lý', 0, 100]]) +

        bt('Thuế của khoản hoàn dự phòng đầu tư', '200 × 20%, nếu đây là chênh lệch tạm thời.', [['Nợ 821 – Chi phí thuế', 40, 0], ['Có 347 – Thuế hoãn lại phải trả', 0, 40]]))}
      ${box('Xử lý theo từng loại', table(['Dự phòng cho', 'Trên hợp nhất', 'Thuế hoãn lại'], [['Phải thu nội bộ, đã được trừ khi tính thuế', 'Hoàn', 'Có'], ['Phải thu nội bộ, không được trừ khi tính thuế', 'Hoàn', 'Không'], ['Đầu tư vào công ty con', 'Hoàn', 'Có, trừ chênh lệch vĩnh viễn'], ['Liên doanh, liên kết theo vốn chủ', 'Hoàn, vì vốn chủ đã phản ánh lỗ', 'Có, trừ chênh lệch vĩnh viễn'], ['Đầu tư khác ngoài tập đoàn', 'Giữ nguyên', 'Không phát sinh']]) + '<p style="margin-top:10px">Nếu hệ thống tự tính thuế cho cả chênh lệch vĩnh viễn thì phải có bút toán đảo phần đó. Khi đơn vị được đầu tư là công ty mẹ, căn cứ trích dự phòng trên sổ riêng là BCTC hợp nhất của công ty mẹ đó (Phụ lục II, tài khoản 229).</p>')}

        bt('Mang sang dự phòng phải thu', 'Còn số dư thì vẫn phải hoàn.', [['Nợ 2293 – Dự phòng phải thu', 100, 0], ['Có 421 – LNCPP', 0, 100]]) +

      ${box('Năm đơn vị hoàn nhập một phần', '<p>Alpha hoàn 30 trong số 100 đã trích, ghi giảm chi phí. Trên hợp nhất khoản dự phòng chưa từng tồn tại nên phải loại cả số dư còn lại 70 lẫn khoản giảm chi phí 30.</p>' +

  { t: 'Hàng thành TSCĐ, góp vốn, dự phòng hàng', r: () => `<div class="card"><h2>Hàng thành TSCĐ, góp vốn bằng tài sản, dự phòng hàng tồn kho</h2>${CASE}

      ${box('Góp vốn bằng tài sản vào công ty con', '<p>Alpha góp TSCĐ giá trị còn lại 600, được đánh giá 800, lãi 200 trên BCTC riêng. Với tập đoàn đây là lãi chưa thực hiện, xử lý như bán TSCĐ nội bộ, cùng với bút toán loại trừ đầu tư (Điều 29).</p>' + bt('Loại lãi góp vốn', 'Khấu hao và thuế hoãn lại điều chỉnh tiếp như trên.', [['Nợ 711 – Thu nhập khác', 200, 0], ['Có 211 – Nguyên giá TSCĐ', 0, 200]]))}
      ${box('Dự phòng giảm giá hàng mua nội bộ', '<p>Bên bán giá gốc 80, bán cho bên mua 100, hàng chưa bán ra ngoài (Điều 38, 39). Trên hợp nhất giá trị hàng là giá gốc 80, nên chỉ giữ phần dự phòng dưới 80.</p>' + table(['Giá trị thuần cuối kỳ', 'Bên mua trích', 'Hợp nhất giữ', 'Phải loại'], [[90, 10, 0, 10], [70, 30, 10, 20]]) + bt('Loại dự phòng', 'Trường hợp 90. Kỳ sau chưa bán chưa hoàn nhập thì ghi Có 421.', [['Nợ 2294 – Dự phòng giảm giá hàng tồn kho', 10, 0], ['Có 632 – Giá vốn', 0, 10]]) + '<p>Nếu bên bán chấp nhận bán lỗ về giá trị thuần thì lỗ đã thực hiện, không loại trừ; dự phòng bên mua trích thêm cũng giữ nguyên. Thuế hoãn lại làm như dự phòng phải thu.</p>')}
      ${box('Bảo hành do đơn vị trong tập đoàn thực hiện', bt('Loại doanh thu và chi phí bảo hành', 'Sản phẩm dùng Có 641; công trình xây dựng dùng Có 632. Nếu bảo hành phát sinh kỳ sau kỳ lập dự phòng thì Có 421. Không ghi thuế hoãn lại (Điều 40, 41).', [['Nợ 511 – Doanh thu', 50, 0], ['Có 641 – Chi phí bán hàng', 0, 50]]))}

  { t: 'Ngân hàng thành viên', r: () => `<div class="card"><h2>Ngân hàng thành viên</h2>${CASE}

  { t: 'Công trình và tài sản nội bộ', r: () => `<div class="card"><h2>Công trình và tài sản nội bộ</h2>${CASE}

  { t: 'BCC có báo cáo riêng', r: () => `<div class="card"><h2>BCC giữa hai đơn vị thành viên</h2>${CASE}

  { t: 'Bao tiêu và khí trả trước', r: () => `<div class="card"><h2>Bao tiêu và khí trả trước</h2>${CASE}

  { g: 'Chuyên đề', t: 'Chuyển đổi ngoại tệ', r: () => `<div class="card"><h2>Chuyển đổi báo cáo ngoại tệ</h2>${CASE}

  { t: 'Qua nhà điều hành', r: () => `<div class="card"><h2>Giao dịch qua nhà điều hành</h2>${CASE}

  { t: 'Chuẩn hóa số liệu', r: () => `<div class="card"><h2>Thu thập và chuẩn hóa</h2>${CASE}

        bt('Thuế hoãn lại', 'Chi phí tăng nên thuế phải giảm. Năm trước: 50 × 20% + 10 × 50% = 15. Năm nay: 29 − 15 = 14. Đơn vị đang có số dư 347 nên ghi giảm 347.', [['Nợ 347 – Thuế hoãn lại phải trả', 29, 0], ['Có 821 – Chi phí thuế', 0, 14], ['Có 421 – LNCPP', 0, 15]]) +

      ${box('Đơn vị điều chỉnh hồi tố', '<p>Có trường hợp đơn vị hồi tố đầu kỳ nhưng tập đoàn không sửa số đầu kỳ đã công bố. Khi đó ảnh hưởng đi vào biến động kỳ này và phải giải thích trong đối chiếu vốn.</p>')}
      ${quiz('a-pol', 'Phần treo 242 khác chính sách là 500, trong đó năm nay 200. Phải ghi Nợ 421 bao nhiêu trước thuế?', 300, '500 − 200 = 300.')}

  { t: 'Khép sổ', r: () => {

  { t: 'Lưu chuyển tiền tệ hợp nhất', r: () => `<div class="card"><h2>Lưu chuyển tiền tệ hợp nhất</h2>

      ${table(['Chỉ tiêu', 'Cộng ngang', 'Nội bộ', 'Hợp nhất'], [['Cổ tức đã trả', 700, -270, 430], ['Cổ tức đã nhận', 300, -270, 30], ['Lãi cho vay đã nhận', 80, -80, 0], ['Lãi vay đã trả', 80, -80, 0]])}

      ${box('Điểm dễ sót', '<p>Phần thanh toán không bằng tiền phải loại khỏi báo cáo. Khi mua hoặc thanh lý công ty con, số đầu kỳ và cuối kỳ không cùng phạm vi nên phải điều chỉnh trước khi tính biến động. Cổ tức trả bằng cổ phiếu cũng không phải dòng tiền.</p><p>TT202 Điều 69: luồng tiền kinh doanh chỉ lập theo phương pháp gián tiếp. Luồng đầu tư và tài chính ưu tiên trực tiếp có điều chỉnh; chỉ dùng trực tiếp khi không mua, thanh lý công ty con trong kỳ.</p>')}
      ${quiz('a-cf1', 'Mẹ trả cổ tức 500. Con 80% trả 200, phần 80% về mẹ. Cổ tức đã trả trên hợp nhất là bao nhiêu?', 540, '500 + 200 − 160 = 540.')}
      ${quiz('a-cf2', 'Mua công ty con giá 900 bằng tiền, công ty con có sẵn 150 tiền. Tiền chi thuần là bao nhiêu?', 750, '900 − 150 = 750.')}` },
  { t: 'Thuyết minh và bên liên quan', r: () => `<div class="card"><h2>Thuyết minh và bên liên quan</h2>${CASE}

      ${box('Việc phải làm', table(['Việc', 'Cách làm'], [['Danh sách bên liên quan', 'Ghi quan hệ và đơn vị trong tập đoàn có giao dịch chính'], ['Nguồn số', 'Ghi rõ từng đơn vị lấy từ báo cáo đã kiểm toán, package hay sổ công nợ'], ['Số dư với bên liên quan', 'Lập theo từng khoản mục, đối chiếu với thuyết minh công nợ'], ['Giá giao dịch', 'Nếu nghi ngờ, chọn mẫu so với giá thị trường']]))}

  { g: 'Tổng hợp', t: 'Thay đổi theo TT99', r: () => `<div class="card"><h2>Từ TT200 sang TT99</h2>

      ${table(['Tài khoản', 'Theo TT99', 'Ảnh hưởng tới bài'], [['242', 'Đổi tên thành Chi phí chờ phân bổ', 'Bao tiêu, Chuẩn hóa số liệu'], ['241', 'Thêm 2414 Nâng cấp, cải tạo TSCĐ; 2413 đổi tên thành Sửa chữa, bảo dưỡng định kỳ TSCĐ', 'Công trình nội bộ'], ['332', 'Tài khoản mới: phải trả cổ tức, lợi nhuận', 'Cổ tức nội bộ, có thể cả BCC'], ['154, 217, 229, 243, 347, 411, 4118, 413, 421', 'Vẫn có trong danh mục', 'Không đổi mã'], ['246, 247', 'Không có trong danh mục tài khoản, cũng không xuất hiện trong toàn văn. Là mã riêng của hồ sơ mẫu; đơn vị chọn tài khoản phù hợp hoặc bổ sung số hiệu theo Điều 11 kèm Quy chế', 'Qua nhà điều hành'], ['429, 269', 'Không phải tài khoản của TT99. Là mã số chỉ tiêu trên Bảng cân đối hợp nhất theo TT202 Điều 13, chỉ tồn tại trên sổ hợp nhất. Mẫu B 01-DN của TT99 không có hai mã này', 'NCI, Đầu tư và LTTM'], ['311', 'Không có trong danh mục. Bài dùng làm tài khoản ghép cho tiền gửi khách hàng của ngân hàng', 'Ngân hàng'], ['112, 1281', '112 là Tiền gửi không kỳ hạn; gửi có kỳ hạn ghi 1281', 'Ngân hàng'], ['2281', 'Vốn góp BCC không đồng kiểm soát tại bên không kế toán chuyển từ 138 sang 2281', 'BCC'], ['244', 'Tên là Ký quỹ, ký cược; tài sản cầm cố, thế chấp không ghi vào đây', 'Ngân hàng'], ['417', 'Không còn trong danh mục tài khoản. Trên Báo cáo tình hình tài chính, mã số 417 là chỉ tiêu chênh lệch tỷ giá, đừng nhầm với tài khoản', 'Có trong biểu vốn của hồ sơ cũ']])}
      <p style="margin-top:10px">Điều 11 cho phép sửa đổi, bổ sung tên, số hiệu, kết cấu và nội dung tài khoản, miễn là không ảnh hưởng chỉ tiêu BCTC và có Quy chế hạch toán kế toán. Bảng này đã đối chiếu danh mục tài khoản tại Phụ lục II và mẫu B 01-DN tại Phụ lục IV của bản scan TT99.</p></div>

      <p>Alpha lãi 500, Bravo (100%) lãi 200, Charlie (70%) lãi 300, đều sau thuế. Thuế suất 20%. Hãy tự tính trước khi xem bảng cuối bài.</p>
      ${table(['Sự kiện trong năm', 'Số liệu'], [['Charlie chia cổ tức, Alpha nhận phần 70%', 100], ['Charlie bán hàng cho Alpha, lãi còn trong tồn kho cuối năm', 50], ['Bravo bán hàng cho Alpha năm trước, năm nay đã bán ra ngoài, lãi', 25], ['Alpha hoàn dự phòng phải thu nội bộ', 100], ['Phân bổ LTTM năm nay', 30], ['Phần lãi từ công ty liên kết', 45]])}</div>

ADV.forEach(l => LESSONS.push(l));

function renderSheet() {
  const el = document.getElementById('wsheet');
  if (!el) return;
  const tb = D.tb[year];
  const on = entries().filter(e => !off.has(year + e.id));
  let tot = 0;
  const left = [];
  const rows = D.tai_khoan.map(a => {
    const base = CONSOL.reduce((s, e) => s + tb[e][a.ma], 0);
    let dr = 0, cr = 0;
    on.forEach(e => e.dong.forEach(l => { if (l.tk === a.ma) { dr += l.no; cr += l.co; } }));
    const v = base + dr - cr;
    tot += v;
    if (['131NB', '331NB', '1283NB', '341NB', '221'].includes(a.ma) && Math.abs(v) > 1e-6) left.push(a.ten);
    if (!base && !dr && !cr) return '';
    return `<tr class="${dr || cr ? 'changed' : ''}"><td class="l">${a.ma} – ${a.ten}</td><td>${fmt(base)}</td><td>${fmt(dr)}</td><td>${fmt(cr)}</td><td>${fmt(v)}</td></tr>`;
  }).join('');
  el.innerHTML = `<div class="status ${left.length ? 'warn' : 'ok'}" role="status">${left.length ? 'Còn số dư nội bộ chưa loại trừ: ' + left.join(', ') + '.' : 'Không còn số dư đầu tư và nội bộ.'}</div>
    <div class="scroll"><table><thead><tr><th class="l">Tài khoản</th><th>Cộng ngang</th><th>ĐC Nợ</th><th>ĐC Có</th><th>Hợp nhất</th></tr></thead>
    <tbody>${rows}<tr class="total"><td class="l">Tổng (phải bằng 0)</td><td>–</td><td></td><td></td><td>${fmt(tot)}</td></tr></tbody></table></div>`;
}
function render(focus) {
  document.getElementById('years').innerHTML = YEARS.map(y => `<button type="button" data-y="${y}" aria-pressed="${y === year}">${y}</button>`).join('');
  document.getElementById('nav').innerHTML = LESSONS.map((l, i) => `${l.g ? `<div class="group">${l.g}</div>` : ''}<button type="button" data-l="${i}" aria-current="${i === lesson}">${i + 1}. ${l.t}</button>`).join('');
  const main = document.getElementById('main');
  main.innerHTML = LESSONS[lesson].r() + `<div class="pager">
    <button class="btn ghost" data-l="${lesson - 1}" ${lesson ? '' : 'hidden'}>← Bài trước</button>
    <button class="btn" data-l="${lesson + 1}" ${lesson < LESSONS.length - 1 ? '' : 'hidden'}>Bài sau →</button></div>`;
  renderSheet();
  if (focus) { main.focus({ preventScroll: true }); window.scrollTo(0, 0); }
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.xall) {
    xoff.clear();
    if (t.dataset.xall === 'off') XT.en.forEach(e => xoff.add(e.id));
    document.querySelectorAll('[data-x]').forEach(c => { c.checked = !xoff.has(c.dataset.x); });
    document.getElementById('xsheet').innerHTML = xSheet();
    return;
  }
  if (t.dataset.ic) { icPick = t.dataset.ic; document.querySelectorAll('[data-ic]').forEach(b => b.setAttribute('aria-pressed', b === t)); document.getElementById('ic-detail').innerHTML = icDetail(); }
  else if (t.dataset.y) { year = +t.dataset.y; render(); }
  else if (t.dataset.l !== undefined) { lesson = +t.dataset.l; render(true); }
  else if (t.dataset.all) { entries().forEach(e => t.dataset.all === 'off' ? off.add(year + e.id) : off.delete(year + e.id)); render(); }
  else if (t.dataset.quiz) {
    const id = t.dataset.quiz, fb = document.getElementById(id + '-fb');
    const raw = document.getElementById(id).value.replace(/[.,\s]/g, '');
    const ok = raw !== '' && Number(raw) === Number(t.dataset.ans);
    fb.className = 'fb ' + (ok ? 'ok' : 'no');
    fb.textContent = ok ? 'Đúng. ' + fb.dataset.explain : 'Chưa đúng, thử lại nhé.';
  }
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset.cal;
  if (!k) return;
  (calV[k] = calV[k] || {})[ev.target.dataset.ci] = Number(ev.target.value) || 0;
  document.getElementById('cal-' + k).innerHTML = calcOut(k);
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.cal) return;
  if (ev.target.dataset.lab) {
    const k = ev.target.dataset.lab, id = k + ev.target.dataset.lid;
    ev.target.checked ? labOff.delete(id) : labOff.add(id);
    document.getElementById('lab-' + k).innerHTML = labSheet(k);
    return;
  }
  if (ev.target.dataset.x) {
    ev.target.checked ? xoff.delete(ev.target.dataset.x) : xoff.add(ev.target.dataset.x);
    document.getElementById('xsheet').innerHTML = xSheet();
    return;
  }
  if (ev.target.dataset.pick !== undefined) {
    const i = ev.target.dataset.pick, v = Number(ev.target.value);
    pickAns[i] = v;
    document.getElementById('pick-' + i).textContent = v < 0 ? '' : v === Number(ev.target.dataset.pa) ? '✓' : '✗';
    return;
  }
  if (ev.target.dataset.ica !== undefined) {
    const id = ev.target.dataset.ica, p = IC.find(x => x.id === id);
    icAns[id] = ev.target.value;
    document.getElementById('ica-' + id).textContent = ev.target.value ? (ev.target.value === p.loai ? '✓' : '✗') : '';
    return;
  }
  const id = ev.target.dataset.e;
  if (!id) return;
  ev.target.checked ? off.delete(year + id) : off.add(year + id);
  renderSheet();
});
document.getElementById('notice').textContent = D.ghi_chu;
render();
