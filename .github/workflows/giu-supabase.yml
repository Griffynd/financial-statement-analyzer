# Goi Supabase 2 lan/tuan de du an free khong bi tam dung (Supabase dung sau 7 ngay khong hoat dong).
# Chay tren may chu GitHub, khong chay tren may cong ty.
# Key la publishable key, da cong khai san trong src/dang-nhap.js.
name: Giu Supabase hoat dong

on:
  schedule:
    - cron: "0 1 * * 1,4"   # 08:00 gio VN thu Hai va thu Nam
  workflow_dispatch:          # cho phep bam chay tay de thu

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Goi Auth va REST
        env:
          SB_URL: https://xclftmhcuelwavneafnk.supabase.co
          SB_KEY: sb_publishable_opoCZ-tOdltH9IcNaQwnhg_2JkNGVnA
        run: |
          curl -fsS "$SB_URL/auth/v1/health" -H "apikey: $SB_KEY"
          echo
          # Sua boi Ngo Ba Hung - Ngay: 2026-11-23: goi ham ping() de GHI vao database (chi doc thi Supabase van canh bao tam dung)
          KQ=$(curl -sS --fail-with-body -X POST "$SB_URL/rest/v1/rpc/ping" -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{}')
          echo "ping: $KQ"
          [ "$KQ" != "null" ] || { echo "Bang keepalive khong co dong nao"; exit 1; }
